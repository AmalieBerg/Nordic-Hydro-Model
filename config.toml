# Nordic Hydro Model: parameters for NO2.
# Everything the model assumes lives here, so a scenario is a config change.

[reservoir]
capacity_gwh = 34043.6      # NVE magasinstatistikk, NO2
max_release_gwh = 1442.0    # highest weekly reservoir production observed (ENTSO-E B12)

[market]
voll_eur_mwh = 3000.0       # value of lost load
discount_rate = 0.05        # annual
cable_availability = 0.87   # share of nameplate usable as a weekly average

# Interconnectors from NO2 to the continent (MW, export / import, start date).
# Internal links to NO1 and NO5 are taken as given from data.
[[cables]]
name = "Skagerrak 1-4 (DK1)"
export_mw = 1632
import_mw = 1632
start = "1976-01-01"

[[cables]]
name = "NorNed (NL)"
export_mw = 700
import_mw = 700
start = "2008-05-01"

[[cables]]
name = "NordLink (DE)"
export_mw = 1400
import_mw = 1400
start = "2020-12-09"

[[cables]]
name = "North Sea Link (GB)"
export_mw = 1400
import_mw = 1400
start = "2021-10-01"

[grid]
n_storage = 101
n_release = 81
n_release_sim = 401
cycles = 4

[scenarios]
inflow_years = [2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]

# Risk aversion in layer 1. Calibrated on 2020-2022, evaluated on 2023-2025
# (see results/risk_calibration.csv). The soft minimum filling curve does
# most of the work; the CVaR tilt alone made the model hoard too much water.
[risk]
cvar_weight = 0.0           # 0 = plain expectation over inflow scenarios
cvar_alpha = 0.2            # tail share used when cvar_weight > 0
min_fill_penalty = 100.0    # EUR/MWh per MWh below the curve
min_fill_quantile = 0.05    # curve = 5th percentile of weekly filling ...
min_fill_years = [1995, 2015]  # ... in NVE history before the scenario years

# Layer 2: the plant valued hour by hour. It gets a share of NO2's weekly
# reservoir release from layer 1, in proportion to its turbine capacity.
[plant]
name = "Representative NO2 plant"
turbine_mw = 1000.0
pump_efficiency = 0.75
battery_roundtrip = 0.88

# Each variant is compared with the base plant above.
[[variants]]
name = "Turbine +200 MW"
turbine_mw = 1200.0

[[variants]]
name = "Pump 200 MW"
pump_mw = 200.0

[[variants]]
name = "Battery 100 MW / 200 MWh"
battery_mw = 100.0
battery_mwh = 200.0

[valuation]
years = [2023, 2024, 2025]

# Five-year price fan. German prices are an input, not a model output.
# Cal-27 and Cal-28: EEX German baseload year futures as reported by
# tacto.ai (closing 9 October 2026). No liquid quotes were found for
# 2029 to 2031, so those years are held at the Cal-28 level. Update
# these numbers before each run; they drive the level of the fan.
[forecast]
start_year = 2027
years = 5
start_fill_years = [2016, 2025]   # start from the median end-of-year filling in these years
shape_years = [2023, 2024, 2025]  # weekly shape of German price and NO2 demand

[[forecast.scenarios]]
name = "German forwards (EEX, Oct 2026)"
de_price = [140.2, 104.8, 104.8, 104.8, 104.8]

[[forecast.scenarios]]
name = "German at 2025 level"
de_price = [89.2, 89.2, 89.2, 89.2, 89.2]